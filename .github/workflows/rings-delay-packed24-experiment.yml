name: Rings packed-24 delay audio comparison (experiment only)

on:
  push:
    branches:
      - rings-delay-packed24-exp

permissions:
  contents: read

concurrency:
  group: rings-delay-packed24-exp
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out firmware and pinned DSP submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Python dependencies
        run: python3 -m pip install --upgrade numpy Pillow
      - name: Install JieLi target toolchain for shared five-model overlay
        run: tools/get_toolchain.sh
      - name: Prepare target compiler environment
        run: echo "JIELI_TOOLCHAIN=${HOME}/.jieli/toolchain" >> "${GITHUB_ENV}"
      - name: Compile pinned DSP and run packed-24 versus float audio comparison
        run: |
          FELUCCA_RINGS_DELAY_PACKED24=1 python3 tools/check_upstream_dsp_compile.py
          python3 tools/rings_delay_packed24_test.py
      - name: Install pinned AC79 SDK for full POOL link diagnostic
        run: |
          SDK_DIR="${HOME}/fw-AC79_AIoT_SDK"
          SDK_URL="https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git"
          SDK_TAG="AC79NN_SDK_V1.2.1_2023-12-13"
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3; do
            rm -rf "${SDK_DIR}"
            if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 clone \
              --depth 1 --single-branch --branch "${SDK_TAG}" \
              "${SDK_URL}" "${SDK_DIR}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Unable to fetch pinned AC79 SDK after 3 attempts" >&2
              exit 1
            fi
            sleep 15
          done
          test -d "${SDK_DIR}/.git"
          echo "AC79_SDK=${SDK_DIR}" >> "${GITHUB_ENV}"
      - name: Link both Rings instances, Clouds and Marbles for POOL measurement (diagnostic only)
        if: always()
        shell: bash
        run: |
          set +e
          FELUCCA_SAMPLE_ENGINE=0 FELUCCA_GRAIN_ENGINE=0 FELUCCA_SLICE=1 \
            FELUCCA_RINGS_DELAY_PACKED24=1 FELUCCA_RIC=1 \
            FELUCCA_CODE_OPT=-Oz FELUCCA_GC_SECTIONS=1 FELUCCA_DATA_SECTIONS=1 \
            ./build.sh 2>&1 | tee build-packed24-full-link.log
          status=${PIPESTATUS[0]}
          echo "Full-link diagnostic exit code: ${status}"
          if [ -f build/rings-clouds.felucca.map ]; then
            grep -E "image [0-9]+ B|RAM \.data|POOL|Rings/Clouds C ABI|error:|Error:|pool headroom|RAM headroom" \
              build-packed24-full-link.log || true
            exit 0
          fi
          exit "${status}"
      - name: Upload audio and metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-delay-packed24-${{ github.sha }}
          path: |
            build/rings-delay-packed24-experiment/results/
            build-packed24-full-link.log
            build/felucca.map
            build/felucca.symbols.txt
            build/felucca.sections.txt
            build/rings-clouds.felucca.map
            build/rings-clouds.felucca.symbols.txt
            build/rings-clouds.felucca.sections.txt
          if-no-files-found: warn
          retention-days: 14
