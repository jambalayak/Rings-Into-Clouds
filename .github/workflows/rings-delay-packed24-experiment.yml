name: Rings packed-24 delay polyphonic stress
on:
  push:
    branches:
      - rings-delay-packed24-experiment
permissions:
  contents: read
concurrency:
  group: rings-delay-packed24-experiment
  cancel-in-progress: true
jobs:
  host-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out pinned DSP submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Python dependencies
        run: python3 -m pip install --upgrade numpy
      - name: Install target toolchain for approved five-model overlay
        run: tools/get_toolchain.sh
      - name: Prepare target compiler environment
        run: echo "JIELI_TOOLCHAIN=${HOME}/.jieli/toolchain" >> "${GITHUB_ENV}"
      - name: Generate approved five-model source overlay
        run: python3 tools/check_upstream_dsp_compile.py
      - name: Run packed-24 polyphonic audio comparison
        run: python3 tools/rings_delay_packed24_test.py
      - name: Upload metrics and WAVs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-delay-packed24-${{ github.sha }}
          path: build/rings-delay-packed24-experiment/results/
          if-no-files-found: warn
          retention-days: 14
