name: FM-1 build and regression

on:
  push:
    branches:
      - rings-into-clouds-development
      - rings-single-rings-development
      - rings-single-rings-memory-exp
      - rings-single-rings-q15-memory-exp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fm1-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out firmware and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare Python build dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install Pillow fonttools
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Install JieLi target toolchain
        run: tools/get_toolchain.sh

      - name: Install pinned AC79 SDK
        run: |
          SDK_DIR="${HOME}/fw-AC79_AIoT_SDK"
          SDK_URL="https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git"
          SDK_TAG="AC79NN_SDK_V1.2.1_2023-12-13"
          # Gitee occasionally terminates large shallow fetches. Retry from a
          # clean directory so a partial .git never gets mistaken for an SDK.
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3; do
            rm -rf "${SDK_DIR}"
            if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 clone \
              --depth 1 --single-branch --branch "${SDK_TAG}" \
              "${SDK_URL}" "${SDK_DIR}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Unable to fetch pinned AC79 SDK after 3 attempts" >&2
              exit 1
            fi
            echo "AC79 SDK fetch failed (attempt ${attempt}/3); retrying in 15 seconds"
            sleep 15
          done
          test -d "${SDK_DIR}/.git"
          echo "JIELI_TOOLCHAIN=${HOME}/.jieli/toolchain" >> "${GITHUB_ENV}"
          echo "AC79_SDK=${SDK_DIR}" >> "${GITHUB_ENV}"

      - name: Verify target C/C++ ABI smoke probe
        run: python3 tools/check_cpp_toolchain.py
      - name: Compile pinned Rings, Clouds and Marbles DSP for FM-1 (compile-only)
        run: python3 tools/check_upstream_dsp_compile.py

      - name: Evaluate compact Rings delay-line prototype (host)
        run: |
          mkdir -p build/host
          c++ -O2 -std=c++11 -Ithird_party -I. -o build/host/rings_compact_delay_test tests/rings_compact_delay_test.cpp
          build/host/rings_compact_delay_test

      - name: Build FM-1 firmware for regression tests
        run: ./build.sh

      - name: Run host regression suite
        run: tests/run_tests.sh

      - name: Upload tested development build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: rings-into-clouds-dev-${{ github.sha }}
          path: |
            build/felucca.fwsc
            build/felucca.bin
            build/felucca.map
            build/felucca.sections.txt
          if-no-files-found: error
          retention-days: 7
      # One-time review artifact: capture the intentional compact-effects render baseline
      # without changing the checked-in golden file or making this run pass by itself.
      - name: Export compact-effects golden renders for review
        if: always()
        run: |
          if [ -x build/host/regress ]; then
            GOLDEN_UPDATE=1 build/host/regress build/host/golden.review.txt tests/cpu_baseline.txt
          else
            echo "Host regression binary unavailable; no golden review artifact"
            exit 1
          fi

      - name: Upload compact-effects golden review artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-into-clouds-golden-review-${{ github.sha }}
          path: build/host/golden.review.txt
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose engine-switch track contributions (host only)
        if: always()
        run: |
          if [ -x build/host/union_test ]; then
            UNION_DIAG=1 build/host/union_test
          else
            echo "union_test was not built; diagnostic skipped"
          fi

      # Always collect the lean profile's linker map, even when unrelated legacy
      # host regressions fail. This is diagnostic only; it is never labelled as tested.
      - name: Link pinned Rings and Clouds behind C ABI (memory diagnostic only)
        if: always()
        run: FELUCCA_SLICE=0 FELUCCA_RIC=1 ./build.sh

      - name: Build lean FM-1 firmware for memory diagnostics (Slicer excluded)
        if: always()
        run: FELUCCA_SLICE=0 ./build.sh

      - name: Upload linker diagnostics (not a firmware release)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-into-clouds-linker-diagnostics-${{ github.sha }}
          path: |
            build/felucca.map
            build/felucca.sections.txt
            build/felucca.symbols.txt
            build/rings-clouds.felucca.map
            build/rings-clouds.felucca.sections.txt
            build/rings-clouds.felucca.symbols.txt
          if-no-files-found: warn
          retention-days: 7

