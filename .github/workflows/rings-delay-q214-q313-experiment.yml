name: Rings signed-16 delay format experiment (Q2.14 and Q3.13)

on:
  push:
    branches:
      - rings-delay-q214-q313-experiment
      - rings-delay-saturation-localization

permissions:
  contents: read

concurrency:
  group: rings-delay-q214-q313-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository and pinned DSP submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Python dependencies
        run: python3 -m pip install --upgrade numpy
      - name: Install JieLi target toolchain for the shared five-model overlay
        run: tools/get_toolchain.sh
      - name: Prepare target compiler environment
        run: echo "JIELI_TOOLCHAIN=${HOME}/.jieli/toolchain" >> "${GITHUB_ENV}"
      - name: Generate approved five-model source overlay
        run: python3 tools/check_upstream_dsp_compile.py
      - name: Compare float, Q2.14 and Q3.13 Rings delay storage
        run: python3 tools/rings_delay_fixedpoint_test.py
      - name: Upload audio and metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-delay-q214-q313-${{ github.sha }}
          path: build/rings-delay-fixedpoint-experiment/results/
          if-no-files-found: warn
          retention-days: 14
