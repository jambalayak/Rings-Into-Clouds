name: Rings upstream float-delay target compiler and size probe
on:
  push:
    branches:
      - rings-delay-packed24-target-probe
      - rings-xip-audit-capture
      - rings-sine-table-fold-probe
      - rings-clouds-engine-trim-probe
      - rings-clouds-no-sample-float-probe
      - rings-clouds-pool-trim-probe
      - rings-clouds-float-delay-probe
permissions:
  contents: read
concurrency:
  group: rings-delay-float-target-probe
  cancel-in-progress: true
jobs:

  font-kern-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v7
      - name: Install font test dependencies
        run: python3 -m pip install --upgrade Pillow fonttools
      - name: Generate baseline and reduced-kerning font tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/font-kern-baseline build/font-kern-2
          python3 tools/gen_aa_font.py build/font-kern-baseline/ui_fonts.h --preset inter-tight --kern-min 1 2>&1 | tee build/font-kern-baseline/generator.log
          python3 tools/gen_aa_font.py build/font-kern-2/ui_fonts.h --preset inter-tight --kern-min 2 2>&1 | tee build/font-kern-2/generator.log
          python3 tools/gen_ui_palettes.py build/font-kern-baseline/ui_palettes.h
          cp build/font-kern-baseline/ui_palettes.h build/font-kern-2/ui_palettes.h
          python3 tools/gen_aa_icons.py build/font-kern-baseline/ui_icons.h
          cp build/font-kern-baseline/ui_icons.h build/font-kern-2/ui_icons.h
          python3 tools/gen_aa_keycaps.py build/font-kern-baseline/ui_keycaps.h
          cp build/font-kern-baseline/ui_keycaps.h build/font-kern-2/ui_keycaps.h
          echo "=== Generated header sizes ==="
          wc -c build/font-kern-baseline/ui_fonts.h build/font-kern-2/ui_fonts.h
          echo "=== Generated font cost summaries ==="
          grep -E '^face |^fonts total' build/font-kern-baseline/generator.log
          grep -E '^face |^fonts total' build/font-kern-2/generator.log
      - name: Compare font metrics, pixels, contrast and spacing
        shell: bash
        run: |
          set -euo pipefail
          for dir in build/font-kern-baseline build/font-kern-2; do
            cc -O1 -w -I"$dir" -Ifirmware/src -o "$dir/theme_test" tests/theme_test.c -lm
            "$dir/theme_test"
            cc -O1 -w -I"$dir" -Ifirmware/src -o "$dir/text_ref_test" tests/text_ref_test.c -lm
            "$dir/text_ref_test"
            python3 tests/text_spacing_test.py "$dir/ui_fonts.h"
          done
      - name: Upload font comparison reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-font-kern-probe-${{ github.sha }}
          path: build/font-kern-*/
          if-no-files-found: warn
          retention-days: 14

  target-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - optimization: "-Os"
            size_strategy: function-minsize
            size_flag: "1"
          - optimization: "-Oz"
            size_strategy: function-minsize
            size_flag: "1"
          - optimization: "-Oz"
            size_strategy: whole-file
            size_flag: "0"
          - optimization: "-Oz"
            size_strategy: no-unwind
            size_flag: "1"
            no_unwind: "1"
    env:
      FELUCCA_CODE_OPT: ${{ matrix.optimization }}
      FELUCCA_SIZE: ${{ matrix.size_flag }}
      FELUCCA_DATA_SECTIONS: "1"
      FELUCCA_ICF_SAFE: ${{ matrix.icf_safe || '0' }}
      FELUCCA_NO_UNWIND: ${{ matrix.no_unwind || '0' }}
    steps:
      - name: Check out pinned DSP submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Python dependencies
        run: python3 -m pip install --upgrade numpy
      - name: Install JieLi target toolchain
        run: tools/get_toolchain.sh
      - name: Prepare target compiler environment
        run: echo "JIELI_TOOLCHAIN=${HOME}/.jieli/toolchain" >> "${GITHUB_ENV}"
      - name: Verify POOL startup initialisation and compact allocation checks
        run: python3 tools/check_ric_pool_init.py
      - name: Generate approved five-model baseline overlay and target size probe
        run: python3 tools/check_upstream_dsp_compile.py
      - name: Install firmware build dependencies
        run: python3 -m pip install --upgrade Pillow fonttools
      - name: Verify upstream float Rings delays and measure target object sizes
        run: python3 tools/check_float_delay_target.py
      - name: Install pinned AC79 SDK
        run: |
          SDK_DIR="${HOME}/fw-AC79_AIoT_SDK"
          SDK_URL="https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git"
          SDK_TAG="AC79NN_SDK_V1.2.1_2023-12-13"
          git config --global http.version HTTP/1.1
          git clone --depth 1 --single-branch --branch "${SDK_TAG}" "${SDK_URL}" "${SDK_DIR}"
          echo "AC79_SDK=${SDK_DIR}" >> "${GITHUB_ENV}"
      - name: Prepare diagnostic-only build (no installable outputs)
        run: python3 tools/prepare_diagnostic_build.py
      - name: Apply temporary Rings/Clouds engine trim overlay
        run: python3 tools/rings_clouds_engine_trim_probe.py
      - name: Remove selectable SAMPLE engine, retain shared SLICE data
        run: python3 tools/rings_clouds_no_sample_probe.py
      - name: Reduce shared engine memory to retained DRUM and SLICE requirements
        run: python3 tools/rings_clouds_pool_trim_probe.py
      - name: Link FM-1 firmware with upstream float Rings (${{ matrix.size_strategy }}, diagnostic only)
        shell: bash
        env:
          FELUCCA_DIAGNOSTIC_ONLY: "1"
        run: |
          set +e
          FELUCCA_RIC=1 FELUCCA_GC_SECTIONS=1 FELUCCA_DATA_SECTIONS=1 FELUCCA_CODE_OPT="${FELUCCA_CODE_OPT}" FELUCCA_SIZE="${FELUCCA_SIZE}" ./build.sh 2>&1 | tee "build/float-delay-target-probe/firmware-link-${FELUCCA_CODE_OPT#-}-${{ matrix.size_strategy }}.log"
          status=${PIPESTATUS[0]}
          echo "firmware build exit status: ${status}" | tee -a "build/float-delay-target-probe/firmware-link-${FELUCCA_CODE_OPT#-}-${{ matrix.size_strategy }}.log"
          for file in rings-clouds.felucca.map rings-clouds.felucca.symbols.txt rings-clouds.felucca.sections.txt; do
            if [ -f "build/${file}" ]; then cp "build/${file}" "build/float-delay-target-probe/${file}"; fi
          done
          if [ ! -s "build/float-delay-target-probe/rings-clouds.felucca.map" ]; then
            echo "No combined linker map was produced" >&2
            exit "${status:-1}"
          fi
          exit 0
      - name: Run Rings float/Q15 host audio comparison
        if: matrix.size_strategy == 'no-unwind'
        run: python3 tools/rings_delay_test.py
      - name: Compile-only UI function-size probes
        if: matrix.size_strategy == 'no-unwind'
        continue-on-error: true
        run: python3 tools/xip_function_probes.py
      - name: Capture read-only XIP audit evidence (text reports only)
        if: always()
        shell: bash
        run: |
          set +e
          STAGE=build/xip-audit-artifact
          mkdir -p "$STAGE/objects" "$STAGE/archives" "$STAGE/reports"
          cp -f build/rings-clouds.felucca.map "$STAGE/reports/" 2>/dev/null
          cp -f build/rings-clouds.felucca.symbols.txt "$STAGE/reports/" 2>/dev/null
          cp -f build/rings-clouds.felucca.sections.txt "$STAGE/reports/" 2>/dev/null
          cp -f build/felucca.o "$STAGE/objects/" 2>/dev/null
          cp -f build/rings-clouds-link/objects.txt "$STAGE/reports/" 2>/dev/null
          cp -f build/float-delay-target-probe/*.log "$STAGE/reports/" 2>/dev/null
          cp -f build/rings-clouds-engine-trim/* "$STAGE/reports/" 2>/dev/null
          cp -f build/float-delay-target-probe/sizes.txt "$STAGE/reports/" 2>/dev/null
          cp -f build/rings-clouds-no-sample/* "$STAGE/reports/" 2>/dev/null
          cp -f build/rings-clouds-engine-trim/* "$STAGE/reports/" 2>/dev/null
          cp -f build/xip-function-probes/* "$STAGE/reports/" 2>/dev/null
          find build -type f -name '*.o' -print0 | while IFS= read -r -d '' f; do
            rel="${f#build/}"
            mkdir -p "$STAGE/objects/$(dirname "$rel")"
            cp -f "$f" "$STAGE/objects/$rel"
          done
          TC="${JIELI_TOOLCHAIN}/common/bin"
          for lib in "${JIELI_TOOLCHAIN}/pi32v2/lib/r3/libm.a" "${JIELI_TOOLCHAIN}/pi32v2/lib/r3/libcompiler_rt.a"; do
            if [ -f "$lib" ]; then cp -f "$lib" "$STAGE/archives/"; fi
          done
          if [ -f build/felucca.elf ]; then
            "$TC/objdump" -d build/felucca.elf > "$STAGE/reports/felucca-elf-disassembly.txt" 2>&1
            "$TC/objdump" -r build/felucca.elf > "$STAGE/reports/felucca-elf-relocations.txt" 2>&1
            "$TC/objdump" -t build/felucca.elf > "$STAGE/reports/felucca-elf-symbols.txt" 2>&1
            "$TC/objdump" -h build/felucca.elf > "$STAGE/reports/felucca-elf-sections.txt" 2>&1
            # The ELF is inspected in-job only and is deliberately excluded from upload.
          fi
          : > "$STAGE/reports/object-relocations.txt"
          : > "$STAGE/reports/object-sections.txt"
          : > "$STAGE/reports/object-symbols.txt"
          find "$STAGE/objects" -type f -name '*.o' -print0 | while IFS= read -r -d '' f; do
            echo "===== $f =====" >> "$STAGE/reports/object-relocations.txt"
            "$TC/objdump" -r "$f" >> "$STAGE/reports/object-relocations.txt" 2>&1
            echo "===== $f =====" >> "$STAGE/reports/object-sections.txt"
            "$TC/objdump" -h "$f" >> "$STAGE/reports/object-sections.txt" 2>&1
            echo "===== $f =====" >> "$STAGE/reports/object-symbols.txt"
            "$TC/objdump" -t "$f" >> "$STAGE/reports/object-symbols.txt" 2>&1
          done
          # Host-side analysis of object symbols, retained tables, string relocations and SMP_DATA.
          python3 -m pip install --quiet pyelftools
          python3 tools/rings_clouds_pool_probe.py build/felucca.o > "$STAGE/reports/pool-probe.txt" 2>&1 || true
          OBJECTS=(build/felucca.o build/fm1_cpu1.o build/fm1_isr.o build/fm1_vec.o build/crt0.o)
          while IFS= read -r rel; do
            [ -n "$rel" ] && [ -f "$rel" ] && OBJECTS+=("$rel")
          done < build/rings-clouds-link/objects.txt
          python3 tools/xip_audit.py --objects "${OBJECTS[@]}" --root . > "$STAGE/reports/table-analysis.log" 2>&1
          cp -f xip-table-hashes.txt xip-identical-duplicates.txt xip-subsets.txt xip-symmetry.txt xip-table-readers.txt xip-strings.txt xip-smp-data-estimates.txt "$STAGE/reports/" 2>/dev/null
          # Remove any accidental image/package outputs from the staging tree.
          find "$STAGE" -type f \( -name '*.elf' -o -name '*.bin' -o -name '*.fwsc' -o -name '*.ufw' \) -delete
          printf 'Branch=%s\nCommit=%s\nStrategy=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "${{ matrix.size_strategy }}" > "$STAGE/reports/build-identity.txt"
      - name: Upload XIP audit evidence (no ELF or flashable images)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-xip-audit-${{ matrix.optimization }}-${{ matrix.size_strategy }}-${{ github.sha }}
          path: build/xip-audit-artifact/
          if-no-files-found: warn
          retention-days: 14


  sample-retained-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out pinned DSP submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Python dependencies
        run: python3 -m pip install --upgrade numpy
      - name: Install JieLi target toolchain
        run: tools/get_toolchain.sh
      - name: Prepare target compiler environment
        run: echo "JIELI_TOOLCHAIN=${HOME}/.jieli/toolchain" >> "${GITHUB_ENV}"
      - name: Verify POOL startup initialisation
        run: python3 tools/check_ric_pool_init.py
      - name: Generate approved five-model and compact Clouds overlays
        run: python3 tools/check_upstream_dsp_compile.py
      - name: Apply packed-24 Rings delay storage required by current POOL budget
        run: python3 tools/check_packed24_target.py
      - name: Install firmware build dependencies
        run: python3 -m pip install --upgrade Pillow fonttools
      - name: Install pinned AC79 SDK
        run: |
          SDK_DIR="${HOME}/fw-AC79_AIoT_SDK"
          SDK_URL="https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git"
          SDK_TAG="AC79NN_SDK_V1.2.1_2023-12-13"
          git config --global http.version HTTP/1.1
          git clone --depth 1 --single-branch --branch "${SDK_TAG}" "${SDK_URL}" "${SDK_DIR}"
          echo "AC79_SDK=${SDK_DIR}" >> "${GITHUB_ENV}"
      - name: Prepare diagnostic-only build
        run: python3 tools/prepare_diagnostic_build.py
      - name: Apply engine trim, retaining SAMPLE for matched comparison
        run: python3 tools/rings_clouds_engine_trim_probe.py
      - name: Link SAMPLE-retained comparison build (no installable outputs)
        shell: bash
        env:
          FELUCCA_DIAGNOSTIC_ONLY: "1"
          FELUCCA_CODE_OPT: "-Oz"
          FELUCCA_SIZE: "1"
          FELUCCA_NO_UNWIND: "1"
        run: |
          set +e
          FELUCCA_RIC=1 FELUCCA_GC_SECTIONS=1 FELUCCA_DATA_SECTIONS=1 FELUCCA_CODE_OPT="${FELUCCA_CODE_OPT}" FELUCCA_SIZE="${FELUCCA_SIZE}" FELUCCA_NO_UNWIND="${FELUCCA_NO_UNWIND}" ./build.sh 2>&1 | tee build/sample-retained-baseline.log
          status=${PIPESTATUS[0]}
          echo "firmware build exit status: ${status}" | tee -a build/sample-retained-baseline.log
          mkdir -p build/sample-retained-baseline
          cp -f build/rings-clouds.felucca.map build/rings-clouds.felucca.symbols.txt build/rings-clouds.felucca.sections.txt build/sample-retained-baseline/ 2>/dev/null
          cp -f build/sample-retained-baseline.log build/sample-retained-baseline/
          exit 0
      - name: Upload SAMPLE-retained diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-sample-retained-baseline-${{ github.sha }}
          path: build/sample-retained-baseline/
          if-no-files-found: warn
          retention-days: 14

  retained-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out pinned DSP submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3
          python3 -m pip install --upgrade numpy Pillow fonttools
      - name: Generate firmware tables and sample data
        run: |
          mkdir -p build/gen build/host build/genwav build/drum-demo build/slice-demo
          python3 tools/gen_tables.py build/gen/felucca_tables.h
          python3 tools/gen_fm6_patches.py build/gen/felucca_fm6.h
          python3 tools/gen_adpcm.py build/gen/felucca_adpcm.h
          python3 tools/gen_samples.py build/gen/felucca_samples.h
      - name: Run DRUM host tests
        run: |
          cc -O2 -w -Ifirmware/hal -Ifirmware/bsp/chip -Ifirmware/bsp/boards/fm1 -Ifirmware/src -Ibuild/gen -o build/host/drum_test tests/drum_test.c -lm
          build/host/drum_test build/drum-demo
      - name: Apply diagnostic engine trim and remove SAMPLE selection
        run: |
          python3 tools/rings_clouds_engine_trim_probe.py
          python3 tools/rings_clouds_no_sample_probe.py
      - name: Run SLICE host tests and user-slot upload round trip
        run: |
          python3 tests/slice_loop.py build/host/LOOP
          python3 tools/fm1_sample_upload.py build LOOP build/host/LOOP build/host/LOOP.wav
          # SAMPLE and GRAIN are deliberately tombstoned in this profile; keep
          # the SLICE PIANO/BREAK/user-slot checks, but skip their engine-only
          # fallback checks in this host test copy.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/slice_test.c")
          s = p.read_text()
          for old in (
              '    sine_ok("SAMPLE on an empty USR2: A4", sine_run(4u, (int16_t)(SMP_NSETS + 1), 69), 440.0);\n',
              '    sine_ok("GRAIN on an empty USR3: C5", sine_run(8u, (int16_t)(SMP_NSETS + 2), 72), 523.25);\n',
              '    check("SLICE on USR1 (a sample), SAMPLE on PIANO: not the sine", !sine_run(SLC_ENG, 1, 60).sine &&\n          !sine_run(4u, 0, 60).sine, 0);'
          ):
              if old not in s:
                  raise SystemExit("expected SAMPLE/GRAIN-only test case not found")
              if old.startswith('    check('):
                  s = s.replace(old, '    check("SLICE on USR1 (a sample): not the sine", !sine_run(SLC_ENG, 1, 60).sine, 0);', 1)
              else:
                  s = s.replace(old, '', 1)
          p.write_text(s)
          PY
          cc -O2 -w -Ifirmware/hal -Ifirmware/bsp/chip -Ifirmware/bsp/boards/fm1 -Ifirmware/src -Ibuild/gen -o build/host/slice_test tests/slice_test.c -lm
          build/host/slice_test build/host/LOOP build/slice-demo
      - name: Run Clouds compact-profile ASan/UBSan and audio tests
        run: python3 tools/clouds_compact_profile_test.py
      - name: Upload retained-engine host test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-clouds-retained-host-tests-${{ github.sha }}
          path: |
            build/drum-demo/
            build/slice-demo/
            build/clouds-compact-profile/
            build/host/LOOP.*
          if-no-files-found: warn
          retention-days: 14
