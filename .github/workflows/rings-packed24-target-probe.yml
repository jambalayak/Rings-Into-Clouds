name: Rings packed-24 target compiler and size probe
on:
  push:
    branches:
      - rings-delay-packed24-target-probe
permissions:
  contents: read
concurrency:
  group: rings-delay-packed24-target-probe
  cancel-in-progress: true
jobs:

  font-kern-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v7
      - name: Install font test dependencies
        run: python3 -m pip install --upgrade Pillow fonttools
      - name: Generate baseline and reduced-kerning font tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/font-kern-baseline build/font-kern-2
          python3 tools/gen_aa_font.py build/font-kern-baseline/ui_fonts.h --preset inter-tight --kern-min 1 2>&1 | tee build/font-kern-baseline/generator.log
          python3 tools/gen_aa_font.py build/font-kern-2/ui_fonts.h --preset inter-tight --kern-min 2 2>&1 | tee build/font-kern-2/generator.log
          python3 tools/gen_ui_palettes.py build/font-kern-baseline/ui_palettes.h
          cp build/font-kern-baseline/ui_palettes.h build/font-kern-2/ui_palettes.h
          python3 tools/gen_aa_icons.py build/font-kern-baseline/ui_icons.h
          cp build/font-kern-baseline/ui_icons.h build/font-kern-2/ui_icons.h
          python3 tools/gen_aa_keycaps.py build/font-kern-baseline/ui_keycaps.h
          cp build/font-kern-baseline/ui_keycaps.h build/font-kern-2/ui_keycaps.h
          echo "=== Generated header sizes ==="
          wc -c build/font-kern-baseline/ui_fonts.h build/font-kern-2/ui_fonts.h
          echo "=== Generated font cost summaries ==="
          grep -E '^face |^fonts total' build/font-kern-baseline/generator.log
          grep -E '^face |^fonts total' build/font-kern-2/generator.log
      - name: Compare font metrics, pixels, contrast and spacing
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline kern-2; do
            dir="build/font-kern-${variant}"
            cc -O1 -w -I"$dir" -Ifirmware/src -o "$dir/theme_test" tests/theme_test.c -lm
            "$dir/theme_test"
            cc -O1 -w -I"$dir" -Ifirmware/src -o "$dir/text_ref_test" tests/text_ref_test.c -lm
            "$dir/text_ref_test"
            python3 tests/text_spacing_test.py "$dir/ui_fonts.h"
          done
      - name: Upload font comparison reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-font-kern-probe-${{ github.sha }}
          path: build/font-kern-*/
          if-no-files-found: warn
          retention-days: 14

  target-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - optimization: "-Os"
            size_strategy: function-minsize
            size_flag: "1"
          - optimization: "-Oz"
            size_strategy: function-minsize
            size_flag: "1"
          - optimization: "-Oz"
            size_strategy: whole-file
            size_flag: "0"
    env:
      FELUCCA_CODE_OPT: ${{ matrix.optimization }}
      FELUCCA_SIZE: ${{ matrix.size_flag }}
      FELUCCA_DATA_SECTIONS: "1"
    steps:
      - name: Check out pinned DSP submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Python dependencies
        run: python3 -m pip install --upgrade numpy
      - name: Install JieLi target toolchain
        run: tools/get_toolchain.sh
      - name: Prepare target compiler environment
        run: echo "JIELI_TOOLCHAIN=${HOME}/.jieli/toolchain" >> "${GITHUB_ENV}"
      - name: Verify POOL startup initialisation and compact allocation checks
        run: python3 tools/check_ric_pool_init.py
      - name: Generate approved five-model baseline overlay and target size probe
        run: python3 tools/check_upstream_dsp_compile.py
      - name: Compile packed-24 Rings and measure target object sizes
        run: python3 tools/check_packed24_target.py
      - name: Install firmware build dependencies
        run: python3 -m pip install --upgrade Pillow fonttools
      - name: Install pinned AC79 SDK
        run: |
          SDK_DIR="${HOME}/fw-AC79_AIoT_SDK"
          SDK_URL="https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git"
          SDK_TAG="AC79NN_SDK_V1.2.1_2023-12-13"
          git config --global http.version HTTP/1.1
          git clone --depth 1 --single-branch --branch "${SDK_TAG}" "${SDK_URL}" "${SDK_DIR}"
          echo "AC79_SDK=${SDK_DIR}" >> "${GITHUB_ENV}"
      - name: Link FM-1 firmware with packed-24 Rings (${{ matrix.size_strategy }}, diagnostic only)
        shell: bash
        run: |
          set +e
          FELUCCA_RIC=1 FELUCCA_GC_SECTIONS=1 FELUCCA_DATA_SECTIONS=1 FELUCCA_CODE_OPT="${FELUCCA_CODE_OPT}" FELUCCA_SIZE="${FELUCCA_SIZE}" ./build.sh 2>&1 | tee "build/packed24-target-probe/firmware-link-${FELUCCA_CODE_OPT#-}-${{ matrix.size_strategy }}.log"
          status=${PIPESTATUS[0]}
          echo "firmware build exit status: ${status}" | tee -a "build/packed24-target-probe/firmware-link-${FELUCCA_CODE_OPT#-}-${{ matrix.size_strategy }}.log"
          for file in rings-clouds.felucca.map rings-clouds.felucca.symbols.txt rings-clouds.felucca.sections.txt; do
            if [ -f "build/${file}" ]; then cp "build/${file}" "build/packed24-target-probe/${file}"; fi
          done
          if [ ! -s "build/packed24-target-probe/rings-clouds.felucca.map" ]; then
            echo "No combined linker map was produced" >&2
            exit "${status:-1}"
          fi
          exit 0
      - name: Upload target object-size and linker reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-packed24-target-probe-${{ matrix.optimization }}-${{ matrix.size_strategy }}-${{ github.sha }}
          path: build/packed24-target-probe/
          if-no-files-found: warn
          retention-days: 14
