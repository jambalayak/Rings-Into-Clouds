name: Rings packed-24 delay scale sweep
on:
  push:
    branches:
      - rings-delay-packed24-target-probe
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rings-packed24-scale-sweep
  cancel-in-progress: true
jobs:
  host-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out pinned DSP submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3
          python3 -m pip install --upgrade numpy
      - name: Install JieLi toolchain for the approved five-model source overlay
        run: tools/get_toolchain.sh
      - name: Prepare target compiler environment
        run: |
          echo "JIELI_TOOLCHAIN=${HOME}/.jieli/toolchain" >> "${GITHUB_ENV}"
          echo "FELUCCA_CODE_OPT=-Os" >> "${GITHUB_ENV}"
          echo "FELUCCA_DATA_SECTIONS=1" >> "${GITHUB_ENV}"
      - name: Generate the approved five-model source overlay
        run: python3 tools/check_upstream_dsp_compile.py
      - name: Run packed-24 scale sweep and same-gain WAV renders
        run: python3 tools/rings_delay_packed24_scale_sweep.py
      - name: Upload per-model metrics and float WAVs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-packed24-scale-sweep-${{ github.sha }}
          path: build/rings-delay-packed24-scale-sweep/results/
          if-no-files-found: warn
          retention-days: 14
