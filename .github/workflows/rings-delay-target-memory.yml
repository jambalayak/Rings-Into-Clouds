name: Rings compact-delay FM-1 target memory probe

on:
  push:
    branches:
      - rings-delay-qn8388-target-probe

permissions:
  contents: read

concurrency:
  group: rings-delay-qn8388-target-probe
  cancel-in-progress: true

jobs:
  target-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out firmware and pinned submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare Python build dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install Pillow fonttools
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Install JieLi target toolchain
        run: tools/get_toolchain.sh

      - name: Install pinned AC79 SDK
        run: |
          SDK_DIR="${HOME}/fw-AC79_AIoT_SDK"
          SDK_URL="https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git"
          SDK_TAG="AC79NN_SDK_V1.2.1_2023-12-13"
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3; do
            rm -rf "${SDK_DIR}"
            if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 clone \
              --depth 1 --single-branch --branch "${SDK_TAG}" \
              "${SDK_URL}" "${SDK_DIR}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Unable to fetch pinned AC79 SDK after 3 attempts" >&2
              exit 1
            fi
            sleep 15
          done
          test -d "${SDK_DIR}/.git"
          echo "JIELI_TOOLCHAIN=${HOME}/.jieli/toolchain" >> "${GITHUB_ENV}"
          echo "AC79_SDK=${SDK_DIR}" >> "${GITHUB_ENV}"

      - name: Run float and compact-delay target linker diagnostics
        shell: bash
        run: |
          set -uo pipefail
          RESULTS="${GITHUB_WORKSPACE}/target-memory-results"
          mkdir -p "${RESULTS}"

          run_profile() {
            local name="$1"
            local scale="$2"
            local opt="${3:--Os}"
            local gc="${4:-0}"
            local data="${5:-0}"
            rm -rf build
            mkdir -p build
            echo "=== ${name} (delay scale: ${scale:-float}, optimization: ${opt}, GC: ${gc}, data sections: ${data}) ==="
            set +e
            if [ -n "${scale}" ]; then
              FELUCCA_RINGS_DELAY_SCALE="${scale}" FELUCCA_CODE_OPT="${opt}" FELUCCA_GC_SECTIONS="${gc}" FELUCCA_DATA_SECTIONS="${data}" FELUCCA_SIZE=1 FELUCCA_SLICE=1 FELUCCA_RIC=1 ./build.sh 2>&1 | tee "${RESULTS}/${name}.log"
              status=${PIPESTATUS[0]}
            else
              env -u FELUCCA_RINGS_DELAY_SCALE FELUCCA_CODE_OPT="${opt}" FELUCCA_GC_SECTIONS="${gc}" FELUCCA_DATA_SECTIONS="${data}" FELUCCA_SIZE=1 FELUCCA_SLICE=1 FELUCCA_RIC=1 ./build.sh 2>&1 | tee "${RESULTS}/${name}.log"
              status=${PIPESTATUS[0]}
            fi
            set -e
            echo "${status}" > "${RESULTS}/${name}.exit-code"
            if [ -f build/rings-clouds.felucca.map ]; then
              cp build/rings-clouds.felucca.map "${RESULTS}/${name}.map"
              cp build/rings-clouds.felucca.symbols.txt "${RESULTS}/${name}.symbols.txt"
              cp build/rings-clouds.felucca.sections.txt "${RESULTS}/${name}.sections.txt"
              if [ -f build/gen/felucca_samples.h ]; then
                cp build/gen/felucca_samples.h "${RESULTS}/${name}.samples.h"
              fi
              echo "Map, symbols, sections and generated sample-range diagnostics saved for ${name}."
            else
              echo "No linker map produced for ${name}."
              return 1
            fi
            grep -E "TARGET SIZE|TARGET DELAY STORAGE|image [0-9]+ B|RAM|POOL|Rings/Clouds" "${RESULTS}/${name}.log" > "${RESULTS}/${name}.summary.txt" || true
          }

          run_profile float ""
          run_profile scale-8388 "8388" "-Os"
          run_profile scale-8388-oz "8388" "-Oz"
          run_profile scale-8388-oz-gc-data "8388" "-Oz" "1" "1"

      - name: Upload target linker diagnostics (not firmware)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rings-qn8388-target-memory-${{ github.sha }}
          path: target-memory-results/
          if-no-files-found: warn
          retention-days: 14
